<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITM Lab Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,.15);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="login">
    <h2>MITM Lab Login</h2>

    <form method="POST" action="/login">
        <input
            type="text"
            name="username"
            placeholder="Username"
            autocomplete="off"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="off"
            required>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
